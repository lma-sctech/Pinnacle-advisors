# Render.com Infrastructure Configuration
# Documentation: https://render.com/docs/infrastructure-as-code
#
# NOTE: Redis must be created manually in Render dashboard after Blueprint deployment
# Redis is not supported in Blueprint YAML files

services:
  # Django Backend Web Service
  - type: web
    name: pinnacle-backend
    runtime: python
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false  # Set manually in dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: pinnacle-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # Set manually after creating Redis service
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: WEB_CONCURRENCY
        value: 2
      - key: RENDER
        value: true
      # Email configuration (set manually in dashboard)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@pinnacle-advisors.tech
      - key: CRM_NOTIFICATION_EMAILS
        value: contact@pinnacle-advisors.tech
      # CORS (set to your Vercel domain)
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Example: https://pinnacle-advisors.vercel.app
      - key: CELERY_BROKER_URL
        sync: false  # Same as REDIS_URL, set after creating Redis

databases:
  # PostgreSQL Database (Free tier: 90 days, then renew or upgrade)
  - name: pinnacle-db
    plan: free
    databaseName: pinnacle_db
    user: pinnacle_user
