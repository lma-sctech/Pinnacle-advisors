<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    {{ partial:gtm-head }}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="alternate" hreflang="fr" href="{{ hreflang_fr }}" />
    <link rel="alternate" hreflang="en" href="{{ hreflang_en }}" />
    <link rel="alternate" hreflang="x-default" href="{{ hreflang_default }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ stylesheet_path }}" />
  </head>
  <body>
    {{ partial:gtm-body }}
    <div class="{{ page_shell_class }}">
      {{ header }}
      {{ main }}
      {{ footer }}
    </div>
    {{ page_scripts }}
  </body>
</html>
